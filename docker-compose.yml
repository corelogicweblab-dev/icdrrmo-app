# ICDRRMO SMART EMERGENCY RESPONSE — local / staging stack
# Usage: copy .env.example to .env, then: docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: icdrrmo
      POSTGRES_PASSWORD: icdrrmo
      POSTGRES_DB: icdrrmo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icdrrmo -d icdrrmo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://icdrrmo:icdrrmo@postgres:5432/icdrrmo?schema=public}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-in-production-min-32-chars-long}
      JWT_ACCESS_EXPIRES_SEC: "900"
      SMS_WEBHOOK_SECRET: ${SMS_WEBHOOK_SECRET:-sms-gateway-shared-secret}
      # Set to 1 only to make `prisma db seed` overwrite SEED_* user passwords on that run.
      FORCE_SEED_PASSWORDS: ${FORCE_SEED_PASSWORDS:-}
      # Compose + nginx + local ports; Firebase static admin (override in root `.env`).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1:80,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,https://icdrrmo-b204e.web.app,https://icdrrmo-b204e.firebaseapp.com}
      PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "4000:4000"

  # Browser calls API/WS on the host — port 4000 is published from `api`.
  # Override via .env if you terminate TLS / nginx on another host (e.g. https://ops.example.com/api/v1).
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
        BACKEND_PROXY_TARGET: ${BACKEND_PROXY_TARGET:-http://api:4000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    depends_on:
      - api
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - admin

volumes:
  pgdata:
  redisdata:
