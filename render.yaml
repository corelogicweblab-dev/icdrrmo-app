# Render Blueprint — ICDRRMO Nest API (optional: connect repo in Render Dashboard → Blueprint)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: icdrrmo-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_SEC
        value: "900"
      - key: DATABASE_URL
        fromDatabase:
          name: icdrrmo-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://icdrrmo-b204e.web.app,https://icdrrmo-b204e.firebaseapp.com
      # Required for live weather maps on all dashboards (Render → icdrrmo-api → Environment):
      - key: WINDY_API_KEY
        sync: false
      # Optional — set in Render Dashboard (sync: false):
      # GEMINI_API_KEY, GEMINI_MODEL, REDIS_URL, INFOBIP_API_KEY,
      # AGENCY_*_SMS_PHONES / AGENCY_*_EMAILS, SMTP_HOST, FIREBASE_SERVICE_ACCOUNT_JSON
    # Do not set REDIS_URL unless you provision Redis (avoids ECONNREFUSED)

databases:
  - name: icdrrmo-db
    plan: basic-256mb
    databaseName: icdrrmo
    user: icdrrmo
