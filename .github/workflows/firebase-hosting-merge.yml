# Build static Next export into admin/out, then deploy Hosting with Firebase CLI + SA JSON.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.17.0

      - name: Check required secrets for static export
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
        run: |
          set -euo pipefail
          ok=0
          if [ -z "${NEXT_PUBLIC_API_URL:-}" ]; then
            echo "::error::Repository secret NEXT_PUBLIC_API_URL is missing or empty. Use an absolute API base URL (e.g. https://your-api.onrender.com/api/v1). Relative /api/v1 breaks on Firebase Hosting."
            ok=1
          fi
          if [ -z "${NEXT_PUBLIC_WS_URL:-}" ]; then
            echo "::error::Repository secret NEXT_PUBLIC_WS_URL is missing or empty. Use an absolute Socket.IO origin (e.g. https://your-api.onrender.com)."
            ok=1
          fi
          if [ "$ok" -ne 0 ]; then exit 1; fi
          if echo "${NEXT_PUBLIC_API_URL}${NEXT_PUBLIC_WS_URL}" | grep -q 'icdrrmo-app-1\.onrender\.com'; then
            echo "::error::Secrets still point at icdrrmo-app-1.onrender.com (wrong Render service). Set NEXT_PUBLIC_API_URL=https://icdrrmo-api.onrender.com/api/v1 and NEXT_PUBLIC_WS_URL=https://icdrrmo-api.onrender.com then redeploy Hosting."
            exit 1
          fi

      - name: Build admin (static export)
        working-directory: admin
        env:
          STATIC_EXPORT: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: npm ci && npm run build

      - name: Verify bundle is Next export (not Firebase default page)
        run: |
          set -euo pipefail
          test -f admin/out/index.html
          grep -q 'ICDRRMO' admin/out/index.html
          grep -q 'SMART Emergency Response' admin/out/index.html
          ! grep -q 'Firebase Hosting Setup Complete' admin/out/index.html

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ICDRRMO_B204E }}
          export_environment_variables: true
          project_id: icdrrmo-b204e

      - name: Deploy Hosting to live channel
        run: |
          set -euo pipefail
          firebase deploy \
            --only hosting \
            --project icdrrmo-b204e \
            --non-interactive \
            --force
