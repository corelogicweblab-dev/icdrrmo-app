# Deploy ICDRRMO API to Render on push to main (configure RENDER_DEPLOY_HOOK_URL in repo secrets).
name: Deploy API (Render)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/render-api-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Trigger Render deploy hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Skip hook (secret not set)
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "Set RENDER_DEPLOY_HOOK_URL repository secret to enable automatic Render deploys."
