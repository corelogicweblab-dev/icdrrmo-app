# Deploy ICDRRMO API to Render on push to main (set RENDER_DEPLOY_HOOK_URL in repo secrets).
name: Deploy API (Render)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/render-api-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set — skipping automatic Render deploy."
            exit 0
          fi
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}"
          echo "Render deploy hook triggered."
