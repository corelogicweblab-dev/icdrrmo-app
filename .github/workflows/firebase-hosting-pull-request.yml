# PR preview: static export + Hosting preview channel (Firebase CLI).

name: Deploy to Firebase Hosting on PR
on: pull_request

concurrency:
  group: firebase-hosting-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.17.0

      - name: Check required secrets for static export
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
        run: |
          set -euo pipefail
          ok=0
          if [ -z "${NEXT_PUBLIC_API_URL:-}" ]; then
            echo "::error::Repository secret NEXT_PUBLIC_API_URL is missing or empty."
            ok=1
          fi
          if [ -z "${NEXT_PUBLIC_WS_URL:-}" ]; then
            echo "::error::Repository secret NEXT_PUBLIC_WS_URL is missing or empty."
            ok=1
          fi
          if [ "$ok" -ne 0 ]; then exit 1; fi
          if echo "${NEXT_PUBLIC_API_URL}${NEXT_PUBLIC_WS_URL}" | grep -q 'icdrrmo-app-1\.onrender\.com'; then
            echo "::error::Secrets still point at icdrrmo-app-1.onrender.com. Use https://icdrrmo-backend-q04d.onrender.com (API path /api/v1 on NEXT_PUBLIC_API_URL only)."
            exit 1
          fi

      - name: Build admin (static export)
        working-directory: admin
        env:
          STATIC_EXPORT: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: npm ci && npm run build

      - name: Verify bundle is Next export (not Firebase default page)
        run: |
          set -euo pipefail
          test -f admin/out/index.html
          grep -q 'ICDRRMO' admin/out/index.html
          grep -q 'SMART Emergency Response' admin/out/index.html
          ! grep -q 'Firebase Hosting Setup Complete' admin/out/index.html

      - name: Strip source maps from Hosting output (not publicly served)
        run: find admin/out -name '*.map' -type f -delete 2>/dev/null || true

      - name: Verify no source maps remain in admin/out
        run: |
          set -euo pipefail
          if find admin/out -name '*.map' -type f | grep -q .; then
            echo "::error::Source maps still present under admin/out — adjust Next export or strip step."
            exit 1
          fi

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ICDRRMO_B204E }}
          export_environment_variables: true
          project_id: icdrrmo-b204e

      - name: Deploy Hosting preview channel
        run: |
          set -euo pipefail
          firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" \
            --only hosting \
            --project icdrrmo-b204e \
            --expires 7d \
            --non-interactive \
            --force | tee "$GITHUB_STEP_SUMMARY"
