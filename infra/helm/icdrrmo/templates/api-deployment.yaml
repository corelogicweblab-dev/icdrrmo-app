apiVersion: apps/v1
kind: Deployment
metadata:
  name: icdrrmo-api
  namespace: {{ .Values.namespace.name }}
  labels:
    app: icdrrmo-api
    {{- include "icdrrmo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: icdrrmo-api
  template:
    metadata:
      labels:
        app: icdrrmo-api
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - secretRef:
                name: icdrrmo-secrets
          env:
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: RISK_INFERENCE_URL
              value: {{ .Values.api.env.RISK_INFERENCE_URL | quote }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: icdrrmo-api
  namespace: {{ .Values.namespace.name }}
spec:
  selector:
    app: icdrrmo-api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
