{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: icdrrmo-secrets
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "icdrrmo.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_ACCESS_SECRET: {{ .Values.secrets.data.JWT_ACCESS_SECRET | default "REPLACE_ME" | quote }}
  DATABASE_URL: {{ .Values.secrets.data.DATABASE_URL | default (printf "postgresql://%s:%s@%s-postgresql:5432/%s?schema=public" .Values.postgresql.auth.username .Values.postgresql.auth.password .Release.Name .Values.postgresql.auth.database) | quote }}
  REDIS_URL: {{ .Values.secrets.data.REDIS_URL | default (printf "redis://%s-redis-master:6379" .Release.Name) | quote }}
  SMS_WEBHOOK_SECRET: {{ .Values.secrets.data.SMS_WEBHOOK_SECRET | default "REPLACE_ME" | quote }}
  SMS_GATEWAY_URL: {{ .Values.secrets.data.SMS_GATEWAY_URL | default "" | quote }}
  SMS_GATEWAY_API_KEY: {{ .Values.secrets.data.SMS_GATEWAY_API_KEY | default "" | quote }}
  OIDC_ISSUER_URL: {{ .Values.secrets.data.OIDC_ISSUER_URL | default "" | quote }}
  OIDC_CLIENT_ID: {{ .Values.secrets.data.OIDC_CLIENT_ID | default "" | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.data.OIDC_CLIENT_SECRET | default "" | quote }}
  OIDC_REDIRECT_URI: {{ .Values.secrets.data.OIDC_REDIRECT_URI | default "" | quote }}
  ADMIN_WEB_URL: {{ .Values.secrets.data.ADMIN_WEB_URL | default .Values.api.env.ADMIN_WEB_URL | quote }}
  FIREBASE_SERVICE_ACCOUNT_JSON: {{ .Values.secrets.data.FIREBASE_SERVICE_ACCOUNT_JSON | default "" | quote }}
{{- end }}
