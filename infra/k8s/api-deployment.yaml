apiVersion: apps/v1
kind: Deployment
metadata:
  name: icdrrmo-api
  namespace: icdrrmo
  labels:
    app: icdrrmo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: icdrrmo-api
  template:
    metadata:
      labels:
        app: icdrrmo-api
    spec:
      containers:
        - name: api
          image: icdrrmo-api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: icdrrmo-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: icdrrmo-api
  namespace: icdrrmo
spec:
  selector:
    app: icdrrmo-api
  ports:
    - port: 4000
      targetPort: 4000
